[general]
mode = "collage"
selection = "random"
interval = 300
collage_count = 4
collage_same_for_all = false
language = "en"
# Come up hidden in the tray. Always in effect when Windows starts the app itself;
# turn this on to get the same behaviour when launching it by hand.
start_minimized = false
# Ask GitHub once at startup whether a newer release exists. Turn this off to stop
# the app reaching the network on its own; the Settings screen can still check by hand.
check_updates = true
# Written by the engine, not by hand: whether rotation was running when the app was
# last closed. It is restored on the next launch.
rotation_active = false

[paths]
wallpapers_folder = "C:\\Users\\Public\\Pictures"
output_folder = "output"
default_wallpaper = ""
# Where "Save as image" puts collages you keep. Relative paths resolve under
# %LOCALAPPDATA%\WallpaperChanger; empty means the default "saved" folder there.
saved_folder = ""

[display]
fit_mode = "fill"
effect = "normal"
# Picture adjustments, applied after the effect. 0 leaves the picture alone.
# Brightness, contrast and saturation also apply to the video wallpaper.
brightness = 0                   # -100 .. 100
contrast = 0                     # -100 .. 100
saturation = 0                   # -100 .. 100
warmth = 0                       # -100 (cool) .. 100 (warm)
blur = 0                         # 0 .. 100
vignette = 0                     # 0 .. 100

# No shortcut is bound out of the box: a global hotkey belongs to one process on
# Windows, so claiming a dozen of them on first run steals combinations from
# whatever the user already runs. Empty means "not registered" — assign the ones
# you want from the Hotkeys screen.
[hotkeys]
next_wallpaper = ""
prev_wallpaper = ""
stop_watch = ""
default_wallpaper = ""
toggle_transparency = ""
toggle_window = ""
# Not shortcuts. Hold scroll_modifier and turn the wheel to fade the focused
# window. Off by default because it installs a system-wide mouse hook.
scroll_enabled = false
scroll_modifier = "alt"          # alt | ctrl | shift | win
effect_normal = ""
effect_bw = ""
effect_vintage = ""
effect_hdr = ""
toggle_video = ""
toggle_video_sound = ""
next_video = ""
prev_video = ""

[transparency]
# Fade every window — the ones open now and any opened later — to one opacity.
# While on, it overrides opacities saved for individual apps. Windows forgets a
# window's opacity when it closes, so this comes back after a restart because the
# app re-applies it at launch: leave "Start with Windows" on for it to survive a
# reboot. Off by default because it installs a system-wide window hook.
all_windows = false
all_windows_alpha = 204          # 20 .. 255 (255 is fully opaque)

[video]
# Also the remembered state: set when the video wallpaper is started or stopped,
# and restored on the next launch.
enabled = false
folder = "C:/Users/klysm/Videos/wuwa"
loop = false
sound = true
